  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #17202a; --muted: #5d6b7a; --line: #dde3ea;
    --accent: #1f5fa8; --chip: #eef3fa; --input: #ffffff; --ph: #6b7886;
    --ok: #2e8b57; --ok-bg: #e8f6ee; --ok-line: #a9dcbf;
    --bad: #c0262d; --bad-bg: #fdecec; --warn: #a65d00; --warn-bg: #fff4e0; --warn-line: #f0c68a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121315; --panel: #1c1d20; --text: #ececec; --muted: #9a9da3; --line: #2c2e33;
      --accent: #2dd4bf; --chip: #26282c; --input: #232529; --ph: #8b8f96;
      --ok: #5cc98a; --ok-bg: #16281e; --ok-line: #2e5a40;
      --bad: #ff8a8a; --bad-bg: #3d1c1e; --warn: #f5b85c; --warn-bg: #3a2c14; --warn-line: #7a5a26;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px 14px 60px; }
  .volver { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
  h1 { font-family: 'Titulo MG', 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 600; font-size: 26px; margin: 6px 0 2px; line-height: 1.15; }
  .sub { color: var(--muted); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, select { font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--input); color: var(--text); }
  input::placeholder { color: var(--ph); }
  .grow { flex: 1; min-width: 150px; }
  .estado { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .estado b { color: var(--text); }
  .estado.pend b { color: var(--warn); }
  /* bloques */
  .bloques { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  .bloque { text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 12px; padding: 10px 12px; cursor: pointer; font: inherit; }
  .bloque.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .bloque .t { font-weight: 700; }
  .bloque .s { font-size: 12px; color: var(--muted); }
  .barra { height: 6px; background: var(--chip); border-radius: 99px; margin-top: 6px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .titulo-lista { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 2px 8px; gap: 8px; flex-wrap: wrap; }
  .titulo-lista h2 { font-size: 18px; margin: 0; }
  .lista { display: flex; flex-direction: column; gap: 8px; }
  .sep { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 12px 2px 0; }
  /* tarjetas */
  .f { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .f.hecho { background: var(--ok-bg); border-color: var(--ok-line); }
  .f.baja { background: var(--bad-bg); border-color: var(--bad); }
  .top { display: flex; gap: 10px; align-items: baseline; }
  .k { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .n { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--chip); white-space: nowrap; }
  .orig { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .res { font-size: 13px; margin-top: 6px; font-weight: 600; color: var(--ok); }
  .f.baja .res { color: var(--bad); }
  .acc { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .b { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 9px; padding: 9px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .b.ok { background: var(--ok); border-color: var(--ok); color: #fff; flex: 1; min-width: 140px; }
  @media (prefers-color-scheme: dark) { .b.ok { color: #0d1a12; } }
  .b.bad { color: var(--bad); border-color: var(--bad); background: none; }
  .b.lnk { border: none; background: none; color: var(--accent); padding: 4px 0; }
  .edit { margin-top: 10px; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; display: grid; gap: 10px; }
  .lbl { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .step { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .step button { width: 44px; height: 40px; border: none; background: var(--chip); color: var(--text); font-size: 20px; cursor: pointer; }
  .step input { width: 64px; text-align: center; border: none; border-radius: 0; }
  .vacio { padding: 24px; text-align: center; color: var(--muted); }
  .nuevo-btn { margin-top: 12px; width: 100%; }
  .flota { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 99px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .flota.on { opacity: .92; }
</style>
</head>

  var API = 'https://script.google.com/macros/s/AKfycbzd0u9hGwlOWxvFpax4MNk5qxwiMw7r8cyLlFrZT0tt7KkL9A9VMW5uak-oVY8EWOZM/exec';
  var BLOQUES = { A: 'Sólidos orgánicos', B: 'Sólidos inorgánicos', C: 'Líquidos orgánicos', D: 'Disolventes', E: 'Refrigerador', N: 'Nuevos' };
  var QUEDA = ['Lleno', '¾', '½', '¼', 'Casi vacío'];
  var FRASCOS = [], CONTEO = {}, COLA = [], BLOQUE = 'A', LAB = '', ABIERTO = null, ENVIANDO = false;

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function keyNum(k) { var m = /^([A-Z])-?(\d+)/i.exec(k); return m ? Number(m[2]) : 1e9; }
  function aviso(t) { var f = document.getElementById('flota'); f.textContent = t; f.classList.add('on'); clearTimeout(aviso.t); aviso.t = setTimeout(function () { f.classList.remove('on'); }, 1600); }
  function original(r) { return [r.cant, r.marca].filter(Boolean).join(' · ') + (r.pzas ? ' · ' + r.pzas + (/^\d+$/.test(r.pzas) ? (r.pzas === '1' ? ' pza' : ' pzas') : '') : ''); }

  // ---- datos ----
  function cargarInventario(res) {
    FRASCOS = res.rows.filter(function (r) { return r[9]; }).map(function (r) {
      var b = String(r[0]).trim().charAt(0).toUpperCase();
      return { id: r[9], k: r[0], n: r[1], cas: r[2], cant: r[3], marca: r[4], pzas: r[5], lab: r[6], b: BLOQUES[b] && b !== 'N' ? b : (r[7] || '?').charAt(0), nota: r[8] };
    });
    document.getElementById('sub').textContent = FRASCOS.length + ' frascos en el inventario · datos del ' + res.actualizado;
    pintar();
  }
  function cargarConteo(lista) {
    var m = {};
    lista.forEach(function (c) { m[c[0]] = { estado: c[6], frascos: c[7], queda: c[8], notas: c[9], por: c[10], fecha: c[11], clave: c[1], reactivo: c[2], lab: c[3], bloque: c[4], cant: c[12], marca: c[13] }; });
    COLA.forEach(function (p) { m[p.id] = p.vista; });   // lo que aún no se envía manda
    CONTEO = m; ls('conteoMG', JSON.stringify(m));
    pintar();
  }
  function revisado(id) { var c = CONTEO[id]; return c && c.estado && c.estado !== 'Pendiente' ? c : null; }

  // ---- envío con cola (funciona sin señal) ----
  try { COLA = JSON.parse(ls('colaConteoMG') || '[]'); } catch (e) { COLA = []; }
  function guardar(datos, vista) {
    datos.accion = 'conteo'; datos.por = document.getElementById('por').value.trim();
    vista.por = datos.por; vista.fecha = 'ahora';
    COLA = COLA.filter(function (p) { return p.id !== datos.id; });
    COLA.push({ id: datos.id, datos: datos, vista: vista });
    CONTEO[datos.id] = vista;
    ls('colaConteoMG', JSON.stringify(COLA));
    pintar(); enviarCola();
  }
  function enviarCola() {
    estadoEnvio();
    if (ENVIANDO || !COLA.length) return;
    ENVIANDO = true;
    var p = COLA[0];
    fetch(API, { method: 'POST', body: JSON.stringify(p.datos), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.mensaje || 'error');
        COLA = COLA.filter(function (x) { return x !== p; }); ls('colaConteoMG', JSON.stringify(COLA));
        ENVIANDO = false; enviarCola();
      })
      .catch(function () { ENVIANDO = false; estadoEnvio(true); setTimeout(enviarCola, 15000); });
  }
  function estadoEnvio(fallo) {
    var e = document.getElementById('estado');
    if (COLA.length) { e.className = 'estado pend'; e.innerHTML = '<b>' + COLA.length + ' cambio' + (COLA.length > 1 ? 's' : '') + ' por enviar</b>' + (fallo ? ' · sin conexión, se reintentará solo' : ' · enviando…'); }
    else { e.className = 'estado'; e.innerHTML = 'Todo guardado en la hoja «Conteo dic 2026».'; }
  }
  addEventListener('online', enviarCola);

  // ---- vista ----
  function filtrados() {
    var q = norm(document.getElementById('q').value.trim()), qc = q.replace(/[^a-z0-9]/g, '');
    if (BLOQUE === 'N') {
      return Object.keys(CONTEO).filter(function (id) { return CONTEO[id].estado === 'Nuevo'; }).map(function (id) {
        var c = CONTEO[id]; return { id: id, k: c.clave || '(sin clave)', n: c.reactivo, lab: c.lab, cant: c.cant, marca: c.marca, pzas: c.frascos, b: 'N', nuevo: true };
      }).filter(function (f) { return !LAB || f.lab === LAB; });
    }
    return FRASCOS.filter(function (f) {
      if (LAB && f.lab !== LAB) return false;
      if (q) return norm(f.k).replace(/[^a-z0-9]/g, '').indexOf(qc) === 0 || norm(f.n).indexOf(q) >= 0;
      return f.b === BLOQUE;
    }).sort(function (a, b) { return keyNum(a.k) - keyNum(b.k) || (a.lab < b.lab ? -1 : 1); });
  }
  function pintarBloques() {
    var h = '';
    ['A', 'B', 'C', 'D', 'E', 'N'].forEach(function (b) {
      var fs = FRASCOS.filter(function (f) { return f.b === b && (!LAB || f.lab === LAB); });
      var hechos = fs.filter(function (f) { return revisado(f.id); }).length;
      var s, pct;
      if (b === 'N') { var n = Object.keys(CONTEO).filter(function (id) { return CONTEO[id].estado === 'Nuevo'; }).length; s = n + ' agregado' + (n === 1 ? '' : 's'); pct = 0; }
      else { s = hechos + ' / ' + fs.length + ' revisados'; pct = fs.length ? Math.round(100 * hechos / fs.length) : 0; }
      h += '<button class="bloque' + (b === BLOQUE ? ' on' : '') + '" data-b="' + b + '"><div class="t">' + (b === 'N' ? 'Nuevos' : 'Reactivos ' + b) + '</div><div class="s">' + BLOQUES[b] + ' · ' + s + '</div>' +
        (b === 'N' ? '' : '<div class="barra"><i style="width:' + pct + '%"></i></div>') + '</button>';
    });
    document.getElementById('bloques').innerHTML = h;
  }
  function tarjeta(f) {
    var c = revisado(f.id), clase = c ? (c.estado === 'Baja' ? ' baja' : ' hecho') : '';
    var h = '<div class="f' + clase + '" data-id="' + esc(f.id) + '"><div class="top"><span class="k">' + esc(f.k) + '</span><span class="n">' + esc(f.n) + '</span>' +
      (f.lab ? '<span class="tag">' + esc(f.lab) + '</span>' : '') + '</div>' +
      '<div class="orig">' + (f.nuevo ? 'Nuevo · ' : 'Registrado: ') + esc(original(f) || '—') + (f.nota ? ' · ' + esc(f.nota) : '') + '</div>';
    if (c && !f.nuevo) {
      var txt = c.estado === 'Sin cambios' ? '✓ Sin cambios' : c.estado === 'Baja' ? '✕ Dar de baja (no hay)' :
        '✓ Actualizado: ' + [c.frascos ? c.frascos + (c.frascos === '1' ? ' frasco' : ' frascos') : '', c.queda ? 'queda ' + c.queda : '', c.notas].filter(Boolean).join(' · ');
      h += '<div class="res">' + esc(txt) + (c.por ? ' <span class="sub">— ' + esc(c.por) + '</span>' : '') + '</div>' +
        '<div class="acc"><button class="b lnk" data-cambiar="1">Corregir</button><button class="b lnk" data-deshacer="1">Deshacer</button></div>';
    } else if (!f.nuevo) {
      h += '<div class="acc"><button class="b ok" data-sin="1">✓ Sin cambios</button><button class="b" data-cambiar="1">Cambió…</button><button class="b bad" data-baja="1">No hay</button></div>';
    } else {
      h += '<div class="acc"><button class="b lnk" data-deshacer="1">Quitar</button></div>';
    }
    if (ABIERTO === f.id) h += editor(f, c);
    return h + '</div>';
  }
  function editor(f, c) {
    var n = c && c.frascos ? c.frascos : (/^\d+$/.test(f.pzas || '') ? f.pzas : '1');
    var q = c && c.queda || '';
    return '<div class="edit"><div><div class="lbl">Número de frascos</div><div class="step"><button data-menos="1">−</button><input name="frascos" inputmode="numeric" value="' + esc(n) + '"><button data-mas="1">+</button></div></div>' +
      '<div><div class="lbl">¿Cuánto queda? (del frasco abierto)</div><div class="chips">' + QUEDA.map(function (x) { return '<button class="chip' + (x === q ? ' on' : '') + '" data-queda="' + x + '">' + x + '</button>'; }).join('') + '</div></div>' +
      '<div><div class="lbl">Notas (opcional)</div><input name="notas" style="width:100%" placeholder="ej. cambió de anaquel, etiqueta dañada" value="' + esc(c && c.notas || '') + '"></div>' +
      '<div class="acc"><button class="b ok" data-guardar="1">Guardar</button><button class="b" data-cerrar="1">Cancelar</button></div></div>';
  }
  function pintar() {
    if (!FRASCOS.length) return;
    pintarBloques();
    var q = document.getElementById('q').value.trim();
    var lista = filtrados();
    var pend = lista.filter(function (f) { return f.nuevo || !revisado(f.id); }), hech = lista.filter(function (f) { return !f.nuevo && revisado(f.id); });
    document.getElementById('titulo').textContent = q ? 'Resultados de «' + q + '»' : (BLOQUE === 'N' ? 'Reactivos nuevos' : 'Reactivos ' + BLOQUE + ' · ' + BLOQUES[BLOQUE]);
    document.getElementById('cuenta').textContent = BLOQUE === 'N' && !q ? lista.length + ' agregados' : pend.length + ' pendientes · ' + hech.length + ' revisados';
    var h = '';
    if (!lista.length) h = '<div class="vacio">' + (BLOQUE === 'N' && !q ? 'Aún no se agregan reactivos nuevos.' : 'Nada que mostrar.') + '</div>';
    h += pend.map(tarjeta).join('');
    if (hech.length) h += '<div class="sep">Ya revisados</div>' + hech.map(tarjeta).join('');
    document.getElementById('lista').innerHTML = h;
  }

  // ---- eventos ----
  document.getElementById('bloques').addEventListener('click', function (e) {
    var b = e.target.closest('[data-b]'); if (!b) return;
    BLOQUE = b.dataset.b; ABIERTO = null; document.getElementById('q').value = ''; pintar(); scrollTo(0, document.getElementById('titulo').offsetTop - 10);
  });
  document.getElementById('labs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lab]'); if (!b) return;
    LAB = b.dataset.lab; this.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c === b); }); pintar();
  });
  var t; document.getElementById('q').addEventListener('input', function () { clearTimeout(t); t = setTimeout(pintar, 150); });
  document.getElementById('por').value = ls('porMG');
  document.getElementById('por').addEventListener('change', function () { ls('porMG', this.value.trim()); });

  function datosBase(f) { return { id: f.id, clave: f.k, reactivo: f.n, lab: f.lab, bloque: f.b, original: original(f) }; }
  function pedirNombre() {
    if (document.getElementById('por').value.trim()) return true;
    aviso('Escribe tu nombre arriba primero'); document.getElementById('por').focus(); return false;
  }
  document.getElementById('lista').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var card = b.closest('.f'), id = card.dataset.id;
    var f = FRASCOS.find(function (x) { return x.id === id; }) || { id: id, nuevo: true };
    if (b.dataset.sin) {
      if (!pedirNombre()) return;
      var d = datosBase(f); d.estado = 'Sin cambios';
      guardar(d, { estado: 'Sin cambios' }); aviso(f.k + ' ✓');
    } else if (b.dataset.baja) {
      if (!pedirNombre()) return;
      if (!b.dataset.confirmar) { b.dataset.confirmar = 1; b.textContent = '¿Seguro? Dar de baja'; setTimeout(function () { if (b.isConnected) { delete b.dataset.confirmar; b.textContent = 'No hay'; } }, 4000); return; }
      var d2 = datosBase(f); d2.estado = 'Baja';
      guardar(d2, { estado: 'Baja' }); aviso(f.k + ' marcado para baja');
    } else if (b.dataset.cambiar) {
      ABIERTO = ABIERTO === id ? null : id; pintar();
    } else if (b.dataset.cerrar) {
      ABIERTO = null; pintar();
    } else if (b.dataset.menos || b.dataset.mas) {
      var inp = card.querySelector('input[name=frascos]'), v = parseInt(inp.value, 10) || 0;
      inp.value = Math.max(0, v + (b.dataset.mas ? 1 : -1));
    } else if (b.dataset.queda) {
      var on = !b.classList.contains('on');
      b.parentNode.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('on'); });
      if (on) b.classList.add('on');
    } else if (b.dataset.guardar) {
      if (!pedirNombre()) return;
      var fr = card.querySelector('input[name=frascos]').value.trim(), qd = card.querySelector('.chip.on'), nt = card.querySelector('input[name=notas]').value.trim();
      var d3 = datosBase(f);
      d3.estado = fr === '0' ? 'Baja' : 'Actualizado'; d3.frascos = fr; d3.queda = qd ? qd.dataset.queda : ''; d3.notas = nt;
      ABIERTO = null;
      guardar(d3, { estado: d3.estado, frascos: fr, queda: d3.queda, notas: nt }); aviso(f.k + ' actualizado');
    } else if (b.dataset.deshacer) {
      var c = CONTEO[id] || {};
      var d4 = f.nuevo ? { id: id, clave: c.clave, reactivo: c.reactivo, lab: c.lab, bloque: c.bloque, original: '' } : datosBase(f);
      d4.estado = 'Pendiente';
      guardar(d4, { estado: 'Pendiente', clave: c.clave, reactivo: c.reactivo, lab: c.lab }); aviso('Deshecho');
    }
  });

  // Nuevo reactivo
  document.getElementById('nuevo').addEventListener('click', function () {
    if (!pedirNombre()) return;
    var box = document.getElementById('formNuevo');
    if (box) { box.remove(); return; }
    var div = document.createElement('div');
    div.id = 'formNuevo'; div.className = 'panel';
    div.innerHTML = '<div class="lbl" style="font-weight:700;color:var(--text)">Reactivo que no está en la lista</div>' +
      '<div style="display:grid;gap:8px"><input name="nombre" placeholder="Nombre del reactivo *">' +
      '<div class="row"><select name="bloque">' + ['A', 'B', 'C', 'D', 'E'].map(function (b) { return '<option value="' + b + '"' + (b === BLOQUE ? ' selected' : '') + '>' + b + ' · ' + BLOQUES[b] + '</option>'; }).join('') + '</select>' +
      '<select name="lab"><option value="1-6">Lab 1-6</option><option value="2-1">Lab 2-1</option></select></div>' +
      '<div class="row"><input name="cantidad" class="grow" placeholder="Cantidad (ej. 25 g)"><input name="marca" class="grow" placeholder="Marca"><input name="frascos" style="width:90px" inputmode="numeric" placeholder="Frascos" value="1"></div>' +
      '<input name="notas" placeholder="Ubicación o notas (opcional)">' +
      '<div class="acc"><button class="b ok" id="guardarNuevo">Agregar</button><button class="b" id="cancelarNuevo">Cancelar</button></div></div>';
    this.after(div);
    div.querySelector('[name=nombre]').focus();
    div.querySelector('#cancelarNuevo').onclick = function () { div.remove(); };
    div.querySelector('#guardarNuevo').onclick = function () {
      var g = function (n) { return div.querySelector('[name=' + n + ']').value.trim(); };
      if (!g('nombre')) { aviso('Falta el nombre'); return; }
      var id = 'N' + Date.now();
      var d = { id: id, clave: '', reactivo: g('nombre'), lab: g('lab'), bloque: g('bloque'), original: '', estado: 'Nuevo',
                frascos: g('frascos'), cantidad: g('cantidad'), marca: g('marca'), notas: g('notas') };
      guardar(d, { estado: 'Nuevo', clave: '', reactivo: d.reactivo, lab: d.lab, bloque: d.bloque, frascos: d.frascos, cant: d.cantidad, marca: d.marca, notas: d.notas });
      div.remove(); aviso('Agregado a «Nuevos»');
    };
  });

  // ---- carga ----
  try { var cc = ls('conteoMG'); if (cc) CONTEO = JSON.parse(cc); } catch (e) {}
  COLA.forEach(function (p) { CONTEO[p.id] = p.vista; });
  try { var ci = ls('inventarioMolinaGroup'); if (ci) { var r0 = JSON.parse(ci); if (r0.rows && r0.rows[0] && r0.rows[0][9]) cargarInventario(r0); } } catch (e) {}
  fetch(API + '?formato=json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(cargarInventario)
    .catch(function () { if (!FRASCOS.length) document.getElementById('lista').innerHTML = '<div class="vacio">No se pudo cargar el inventario. Revisa la conexión y recarga.</div>'; });
  function actualizarConteo() {
    fetch(API + '?formato=conteo', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (res) { cargarConteo(res.conteo || []); }).catch(function () {});
  }
  actualizarConteo();
  setInterval(function () { if (!ABIERTO && !document.getElementById('formNuevo')) actualizarConteo(); }, 60000);   // ver lo que marcan los demás
  enviarCola();
</script>
</body>
</html>
