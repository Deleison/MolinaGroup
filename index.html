<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario · Molina Group</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Inventario MG">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #17202a; --muted: #5d6b7a;
    --line: #dde3ea; --accent: #1f5fa8; --chip: #eef3fa;
    --hl: #fff1a8; --hl-text: #17202a;
    --input: #ffffff; --input-line: #1f5fa8; --ph: #6b7886;
    --loan: #a65d00; --loan-bg: #fff4e0; --loan-line: #f0c68a; --bad: #c0262d; --bad-bg: #fdecec; --good: #2e8b57;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419; --panel: #182029; --text: #e6edf3; --muted: #93a1b0;
      --line: #2a3542; --accent: #5aa2f0; --chip: #22303e;
      --hl: #6b5a12; --hl-text: #fff6d0;
      --input: #263445; --input-line: #5aa2f0; --ph: #b4c0cc;
      --loan: #f5b85c; --loan-bg: #3a2c14; --loan-line: #7a5a26; --bad: #ff8a8a; --bad-bg: #3d1c1e; --good: #5cc98a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .search { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .lbl { display: block; font-weight: 700; font-size: 15px; margin: 0 0 8px 2px; }
  .qwrap { position: relative; }
  .ico { position: absolute; left: 14px; top: 50%; width: 22px; height: 22px; transform: translateY(-50%); color: var(--input-line); pointer-events: none; }
  #q { width: 100%; font-size: 18px; padding: 14px 14px 14px 46px; border-radius: 10px; border: 2px solid var(--input-line);
       background: var(--input); color: var(--text); outline: none; -webkit-appearance: none; appearance: none; }
  #q::placeholder { color: var(--ph); opacity: 1; }
  #q:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--input-line) 35%, transparent); }
  .filters { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 14px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 14px 2px 8px; min-height: 22px; }
  .count { color: var(--muted); font-size: 13px; }
  .share { background: none; border: 1px solid var(--line); color: var(--accent); border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .share[hidden] { display: none; }

  /* resultados */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 10px; padding: 10px 12px; }
  .cat { display: inline-flex; align-items: center; gap: 6px; color: var(--c); font-weight: 600; }
  .cat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .cA { --c: #2e8b57; } .cB { --c: #7b5cc4; } .cC { --c: #1f78c8; } .cD { --c: #c46a12; } .cE { --c: #0f8f99; }
  @media (prefers-color-scheme: dark) {
    .cA { --c: #5cc98a; } .cB { --c: #ad94f0; } .cC { --c: #6cb2f2; } .cD { --c: #f0a24e; } .cE { --c: #4fd1d9; }
  }
  .top { display: flex; align-items: baseline; gap: 10px; }
  .k { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .n { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .labs { display: flex; gap: 4px; flex-shrink: 0; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .meta .abr { font-weight: 600; color: var(--text); }
  .meta b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .ficha { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .ficha:hover { text-decoration: underline; }
  .pres { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .p { font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .p .lab { color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  mark { background: var(--hl); color: var(--hl-text); border-radius: 3px; padding: 0 1px; }
  .lnk { background: none; border: none; padding: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .lnk:hover { text-decoration: underline; }
  .loan { margin-top: 6px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 10px;
          font-size: 13px; padding: 5px 9px; border-radius: 8px; background: var(--loan-bg); color: var(--loan); border: 1px solid var(--loan-line); }
  .loan b { font-weight: 700; }
  .loan.venc { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
  .loan .acc { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .loan .lnk { color: inherit; text-decoration: underline; }
  .dclave { width: 120px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--input); color: var(--text); font-size: 13px; }
  .pform { margin-top: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); display: grid; gap: 8px; }
  .pform label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
  .pform input { font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--input); color: var(--text); width: 100%; }
  .ftitle { font-weight: 700; font-size: 14px; }
  .fl { font-size: 13px; color: var(--muted); margin-bottom: -4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chips input { width: auto; font-size: 14px; padding: 5px 8px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .fbtns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bprim { background: var(--accent); color: var(--bg); border: none; border-radius: 8px; padding: 9px 16px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .bsec { background: none; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .bprim.sm, .bsec.sm { padding: 4px 10px; font-size: 13px; }
  .bprim:disabled { opacity: .6; }
  .fmsg { font-size: 13px; color: var(--bad); }
  .fnote { font-size: 12px; color: var(--muted); }
  .hist { margin-top: 8px; font-size: 13px; display: grid; gap: 3px; }
  .hist.big { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; gap: 5px; }
  .hrow { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
  .hrow b { font-weight: 700; }
  .hacc { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  .lnk.del { color: var(--muted); font-weight: 500; font-size: 12px; }
  .hmore { color: var(--muted); font-size: 12px; }
  .fld { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
  .acwrap { position: relative; }
  .sug { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; background: var(--panel); border: 1px solid var(--line);
         border-radius: 10px; padding: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.25); display: grid; }
  .sug[hidden] { display: none; }
  .sug button { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; text-align: left; background: none; border: none;
                color: var(--text); font-size: 15px; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
  .sug button:hover, .sug button:focus { background: var(--chip); }
  .sug button span { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tom { color: var(--muted); font-weight: 600; } .regbox[hidden] { display: none; } .regbox { display: grid; gap: 8px; }
  .ok { color: var(--good); font-weight: 600; } .pend { color: var(--loan); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; }
  .resumen { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; display: grid; gap: 4px; }
  .rrow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
  .tbtn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 14px; cursor: pointer; }
  .tbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .tbtn[hidden] { display: none; }
  .empty, .loading { padding: 28px; text-align: center; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .foot { margin-top: 28px; text-align: center; }
  .btn2 { display: inline-block; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); color: var(--accent);
          text-decoration: none; font-weight: 600; font-size: 14px; background: var(--panel); }

  }

  .hero .hred { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: var(--accent); opacity: .28;
                 -webkit-mask: var(--red) right center / 260px 260px repeat; mask: var(--red) right center / 260px 260px repeat; }
  .hero::before { z-index: 1; }
  .hero > *:not(.hred) { z-index: 2; }
  .hero h1, .hero .sub { position: relative; z-index: 2; }
  .logo { width: 64px; height: 64px; flex-shrink: 0; filter: drop-shadow(0 2px 6px rgba(15,94,156,.25)); }
  .hero h1 { font-family: 'Titulo MG', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 600; font-size: 30px; line-height: 1.1; letter-spacing: .2px; }
  .hero .sub { margin-top: 4px; }
  .foto-pie { margin: 22px auto 0; max-width: 640px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
  .foto-pie img { display: block; width: 100%; height: auto; }
  .foto-pie figcaption { padding: 8px 12px; font-size: 13px; color: var(--muted); text-align: center; }
  .foto-pie figcaption b { font-family: 'Titulo MG', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 600; font-size: 16px; color: var(--text); }
  .cab { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); margin-top: -8px; }
  .cab .hero { border: none; border-radius: 0; margin: 0; }
  .portada { position: relative; display: block; }
  .portada img { display: block; width: 100%; height: 120px; object-fit: cover; object-position: center 40%; }
  .portada::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 34px; background: linear-gradient(#e4f0f9, rgba(228,240,249,0)); }
  @media (prefers-color-scheme: dark) { .portada::before { background: linear-gradient(#142433, rgba(20,36,51,0)); } }
  @media (min-width: 700px) { .portada img { height: 160px; } }
  #nieve { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  @media (max-width: 600px) {
    .hero { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; row-gap: 8px; align-items: center; }
    .hero .tbox { display: contents; }
    .logo { width: 54px; height: 54px; grid-column: 1; grid-row: 1; }
    .hero h1 { grid-column: 2; grid-row: 1; font-size: calc(30px - 6px); }
    .hero .sub { grid-column: 1 / -1; grid-row: 2; margin-top: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">

<script>
  var DATA = [], MAX = 200, LOADED = false, FULL = false;
  var CASRE = /^\d{2,7}-\d{2}-\d$/;

  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function compact(s) { return norm(s).replace(/[^a-z0-9]/g, ''); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function hl(text, words) {
    var t = esc(text);
    words.forEach(function (w) {
      if (w.length < 2) return;
      var re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      t = t.replace(re, '<mark>$1</mark>');
    });
    return t;
  }

  function espaciado(s) { return ' ' + norm(s).replace(/[^a-z0-9]+/g, ' ').trim() + ' '; }
  var SIN2 = SIN.map(function (e) { return { abr: e[0], nombres: e[1], pats: e[1].map(espaciado) }; });

  function aliasDe(nombre) {
    var s = espaciado(nombre), abr = [], extra = [];
    SIN2.forEach(function (e) {
      // Solo si el nombre EMPIEZA con ese compuesto (evita que "Biphenyl-4-methanol" se tome como metanol)
      if (e.pats.some(function (p) { return s.indexOf(p) === 0; })) {
        e.abr.forEach(function (a) { if (abr.indexOf(a) < 0) abr.push(a); });
        e.nombres.forEach(function (n) { extra.push(n); });
      }
    });
    return { abr: abr, extra: extra, texto: abr.concat(extra).join(' | ') };
  }


  // Agrupa frascos del mismo reactivo (misma clave y mismo nombre)
  function agrupar(rows) {
    var map = {}, out = [];
    rows.forEach(function (r) {
      var id = r[0].toUpperCase() + '|' + compact(r[1]);
      var g = map[id];
      if (!g) {
        g = map[id] = { k: r[0], n: r[1], cas: r[2], cat: r[7], labs: [], pres: [], notas: [] };
        out.push(g);
      }
      if (!g.cas && r[2]) g.cas = r[2];
      if (r[6] && g.labs.indexOf(r[6]) < 0) g.labs.push(r[6]);
      g.pres.push({ q: r[3], m: r[4], p: r[5], lab: r[6] });
      if (r[8] && g.notas.indexOf(r[8]) < 0) g.notas.push(r[8]);
    });
    out.forEach(function (g) {
      var al = aliasDe(g.n); g.abr = al.abr; g.abrc = al.abr.map(compact).concat(al.extra.map(compact));
      var t = g.k + ' ' + g.n + ' ' + g.cas + ' | ' + al.texto;
      g.nn = norm(g.n); g.t = norm(t); g.c = compact(t); g.kc = compact(g.k); g.casc = compact(g.cas);
    });
    return out;
  }

  function load(res, provisional) {
    LOADED = true;
    DATA = agrupar(res.rows);
    indexarPrestamos();
    var frascos = res.rows.length;
    document.getElementById('sub').textContent = DATA.length + ' reactivos · ' + frascos + ' frascos · datos del ' + res.actualizado + (provisional ? ' · actualizando…' : '');
    var cats = {}; DATA.forEach(function (d) { cats[d.cat] = 1; });
    var sel = document.getElementById('cat'), actual = sel.value || PARAMS.cat || '';
    while (sel.options.length > 1) sel.remove(1);
    Object.keys(cats).sort().forEach(function (c) { var o = document.createElement('option'); o.textContent = c; sel.appendChild(o); });
    sel.value = actual;
    refrescar();
  }

  function puntaje(d, q, qc, words) {
    if (qc && d.kc === qc) return 0;                 // clave exacta
    if (qc && d.casc === qc) return 1;               // CAS exacto
    var qs = compact(words.join(''));
    if (qc && (d.abrc.indexOf(qc) >= 0 || d.abrc.indexOf(qs) >= 0)) return 1.5;   // abreviatura, fórmula o nombre equivalente exacto (DBU, TFA, ácido acético)
    if (d.nn.indexOf(q) === 0) return 2;             // el nombre empieza con lo buscado
    if ((' ' + d.nn.replace(/[^a-z0-9]+/g, ' ')).indexOf(' ' + words[0]) >= 0) return 3; // alguna palabra empieza así
    return 4;
  }

  function ficha(d) {
    var url = CASRE.test(d.cas)
      ? 'https://pubchem.ncbi.nlm.nih.gov/compound/' + encodeURIComponent(d.cas) + '#section=Safety-and-Hazards'
      : 'https://pubchem.ncbi.nlm.nih.gov/#query=' + encodeURIComponent(d.n);
    return '<a class="ficha" href="' + url + '" target="_blank" rel="noopener">Ficha de seguridad ↗</a>';
  }

  function actualizarURL(q, lab, cat, modo) {
    var p = new URLSearchParams();
    if (q) p.set('q', q); if (lab) p.set('lab', lab); if (cat) p.set('cat', cat); if (modo) p.set('p', modo);
    var s = p.toString();
    try { history.replaceState(null, '', location.pathname + (s ? '?' + s : '')); } catch (e) {}
    document.getElementById('share').hidden = !s;
  }

  function search() {
    var qraw = document.getElementById('q').value.trim();
    var lab = document.getElementById('lab').value, cat = document.getElementById('cat').value;
    var modo = PREST_OK && HIST ? 'historial' : '';
    var out = document.getElementById('out'), count = document.getElementById('count');
    ABIERTO = null; PENDIENTE = false;
    actualizarURL(qraw, lab, cat, modo);
    if (!LOADED) { count.textContent = ''; out.innerHTML = '<div class="loading">Cargando inventario…</div>'; return; }
    if (!qraw && !lab && !cat && !modo) { count.textContent = ''; out.innerHTML = ''; return; }
    var q = norm(qraw), qc = compact(qraw);
    var words = q.split(/\s+/).filter(function (w) { return w && !VACIAS[w]; });
    if (!words.length && q) words = q.split(/\s+/).filter(Boolean);
    // Cada palabra se busca también traducida (español <-> inglés)
    var vars = words.map(function (w) { return [w].concat(PAL2[w] || []); });
    if (modo === 'historial') { vistaHistorial(qraw, vars, lab, cat); return; }
    var res = DATA.filter(function (d) {
      if (modo === 'ahora' && !d.act.length) return false;
      if (modo === 'vencidos' && !d.act.some(vencido)) return false;
      if (lab && d.labs.indexOf(lab) < 0) return false;
      if (cat && d.cat !== cat) return false;
      return vars.every(function (vs) { return vs.some(function (w) { var wc = compact(w); return d.t.indexOf(w) >= 0 || (wc && d.c.indexOf(wc) >= 0); }); });
    });
    if (words.length) res.forEach(function (d) { d.s = puntaje(d, q, qc, words); });
    var antiguo = function (d) { return d.act.reduce(function (m, l) { return l.fecha < m ? l.fecha : m; }, '9999'); };
    var porPrestamo = function (a, b) {
      if (!modo) return 0;
      var va = a.act.some(vencido) ? 0 : 1, vb = b.act.some(vencido) ? 0 : 1;
      return (va - vb) || (antiguo(a) < antiguo(b) ? -1 : antiguo(a) > antiguo(b) ? 1 : 0);
    };
    res.sort(function (a, b) { return (words.length ? a.s - b.s : 0) || porPrestamo(a, b) || keyNum(a.k) - keyNum(b.k); });

        var n = g(c - 1), k = g(c);
        if (!n || !k) continue;
        rows.push([k, n, g(c + 4), g(c + 1), g(c + 2), g(c + 3), lab, CAT[hoja], g(c + 5)]);
      }
    }
    return rows;
  }
  Promise.all(Object.keys(CAT).map(function (h) {
    return fetch(SHEET + encodeURIComponent(h), { credentials: 'omit', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (t) { return bloques(h, csv(t)); });
  })).then(function (partes) {
    if (FULL) return;
    var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    load({ rows: [].concat.apply([], partes),
           actualizado: p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) }, true);
  }).catch(function () {});

  // 3) versión completa (Apps Script); reemplaza a las anteriores y se guarda en el dispositivo
  fetch(API, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (res) {
      FULL = true;
      load(res, false);
      try { localStorage.setItem(KEY, JSON.stringify(res)); } catch (e) {}
    })
    .catch(function (e) {
      var sub = document.getElementById('sub');
      if (LOADED) { sub.textContent = sub.textContent.replace(' · actualizando…', ''); return; }
      sub.textContent = '';
      document.getElementById('out').innerHTML = '<div class="empty">No se pudo leer el inventario (' + esc(e.message || e) + '). Recarga la página en un momento.</div>';
    });

  // Nieve sobre el encabezado: del 1 de diciembre al 6 de enero (o con ?nieve=1 en el enlace)
  (function () {
    var d = new Date(), m = d.getMonth(), dia = d.getDate();
    var temporada = m === 11 || (m === 0 && dia <= 6) || /[?&]nieve=1/.test(location.search);
    if (!temporada || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    var cv = document.getElementById('nieve'), cx = cv.getContext('2d'), W, H, dpr = Math.min(2, window.devicePixelRatio || 1), copos = [];
    cv.hidden = false;
    function medir() { W = cv.offsetWidth; H = cv.offsetHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    medir(); addEventListener('resize', medir);
    var n = Math.round(Math.min(60, W / 11));
    for (var i = 0; i < n; i++) copos.push({ x: Math.random() * W, y: Math.random() * H, r: 0.8 + Math.random() * 2.2, v: 0.25 + Math.random() * 0.55, f: Math.random() * 6.28 });
    var oscuro = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    function cuadro() {
      cx.clearRect(0, 0, W, H);
      cx.fillStyle = 'rgba(255,255,255,.95)';
      cx.strokeStyle = oscuro ? 'rgba(255,255,255,0)' : 'rgba(70,130,190,.35)'; cx.lineWidth = 0.8;
      copos.forEach(function (c) {
        c.y += c.v; c.f += 0.01; c.x += Math.sin(c.f) * 0.3;
        if (c.y > H + 3) { c.y = -3; c.x = Math.random() * W; }
        cx.beginPath(); cx.arc(c.x, c.y, c.r, 0, 6.283); cx.fill(); if (!oscuro) cx.stroke();
      });
      requestAnimationFrame(cuadro);
    }
    cuadro();
  })();
</script>
