  .lbl { display: block; font-weight: 700; font-size: 15px; margin: 0 0 8px 2px; }
  .qwrap { position: relative; }
  .ico { position: absolute; left: 14px; top: 50%; width: 22px; height: 22px; transform: translateY(-50%); color: var(--input-line); pointer-events: none; }

  .item { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 10px; padding: 10px 12px; }

  .top { display: flex; align-items: baseline; gap: 10px; }
  .k { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .n { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .labs { display: flex; gap: 4px; flex-shrink: 0; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .meta .abr { font-weight: 600; color: var(--text); }
  .meta b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .ficha { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .ficha:hover { text-decoration: underline; }
  .pres { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .p { font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .p .lab { color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  mark { background: var(--hl); color: var(--hl-text); border-radius: 3px; padding: 0 1px; }
  .empty, .loading { padding: 28px; text-align: center; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

    'benceno': 'benzene', 'tolueno': 'toluene', 'piridina': 'pyridine', 'naftaleno': 'naphthalene', 'antraceno': 'anthracene',
    'antraquinona': 'anthraquinone', 'pireno': 'pyrene', 'fenantreno': 'phenanthrene', 'tiofeno': 'thiophene',
    'furano': 'furan', 'pirrol': 'pyrrole', 'indol': 'indole', 'imidazol': 'imidazole', 'pirazina': 'pyrazine',
    'carbazol': 'carbazole', 'fenol': 'phenol', 'eter': 'ether', 'cetona': 'ketone', 'acrilato': 'acrylate',
    'malonato': 'malonate', 'benzoico': 'benzoic', 'acetico': 'acetic', 'formico': 'formic', 'oxalico': 'oxalic',
    'citrico': 'citric', 'salicilico': 'salicylic', 'ftalico': 'phthalic', 'boronico': 'boronic', 'sulfonico': 'sulfonic',
    'glucosa': 'glucose', 'urea': 'urea', 'cumarina': 'coumarin', 'curcumina': 'curcumin', 'ferroceno': 'ferrocene',
    'colesterol': 'cholesterol', 'azufre': 'sulfur', 'yodo2': 'iodine'
  };
  var VACIAS = { 'de': 1, 'del': 1, 'la': 1, 'el': 1, 'los': 1, 'las': 1, 'y': 1, 'en': 1, 'con': 1 };
  var PAL2 = {};
  Object.keys(PAL).forEach(function (es) { PAL2[es] = [PAL[es]]; (PAL2[PAL[es]] = PAL2[PAL[es]] || []).push(es); });

  function espaciado(s) { return ' ' + norm(s).replace(/[^a-z0-9]+/g, ' ').trim() + ' '; }
  var SIN2 = SIN.map(function (e) { return { abr: e[0], nombres: e[1], pats: e[1].map(espaciado) }; });

  function aliasDe(nombre) {
    var s = espaciado(nombre), abr = [], extra = [];
    SIN2.forEach(function (e) {
      // Solo si el nombre EMPIEZA con ese compuesto (evita que "Biphenyl-4-methanol" se tome como metanol)
      if (e.pats.some(function (p) { return s.indexOf(p) === 0; })) {
        e.abr.forEach(function (a) { if (abr.indexOf(a) < 0) abr.push(a); });
        e.nombres.forEach(function (n) { extra.push(n); });
      }
    });
    return { abr: abr, extra: extra, texto: abr.concat(extra).join(' | ') };
  }


  // Agrupa frascos del mismo reactivo (misma clave y mismo nombre)
  function agrupar(rows) {
    var map = {}, out = [];
    rows.forEach(function (r) {
      var id = r[0].toUpperCase() + '|' + compact(r[1]);
      var g = map[id];
      if (!g) {
        g = map[id] = { k: r[0], n: r[1], cas: r[2], cat: r[7], labs: [], pres: [], notas: [] };
        out.push(g);
      }
      if (!g.cas && r[2]) g.cas = r[2];
      if (r[6] && g.labs.indexOf(r[6]) < 0) g.labs.push(r[6]);
      g.pres.push({ q: r[3], m: r[4], p: r[5], lab: r[6] });
      if (r[8] && g.notas.indexOf(r[8]) < 0) g.notas.push(r[8]);
    });
    out.forEach(function (g) {
      var al = aliasDe(g.n); g.abr = al.abr; g.abrc = al.abr.map(compact).concat(al.extra.map(compact));
      var t = g.k + ' ' + g.n + ' ' + g.cas + ' | ' + al.texto;
      g.nn = norm(g.n); g.t = norm(t); g.c = compact(t); g.kc = compact(g.k); g.casc = compact(g.cas);
    });
    return out;
  }

  function load(res, provisional) {
    LOADED = true;
    DATA = agrupar(res.rows);
    var frascos = res.rows.length;
    document.getElementById('sub').textContent = DATA.length + ' reactivos · ' + frascos + ' frascos · datos del ' + res.actualizado + (provisional ? ' · actualizando…' : '');
    var cats = {}; DATA.forEach(function (d) { cats[d.cat] = 1; });
    var sel = document.getElementById('cat'), actual = sel.value || PARAMS.cat || '';
    while (sel.options.length > 1) sel.remove(1);
    Object.keys(cats).sort().forEach(function (c) { var o = document.createElement('option'); o.textContent = c; sel.appendChild(o); });
    sel.value = actual;
    search();
  }

  function puntaje(d, q, qc, words) {
    if (qc && d.kc === qc) return 0;                 // clave exacta
    if (qc && d.casc === qc) return 1;               // CAS exacto
    var qs = compact(words.join(''));
    if (qc && (d.abrc.indexOf(qc) >= 0 || d.abrc.indexOf(qs) >= 0)) return 1.5;   // abreviatura, fórmula o nombre equivalente exacto (DBU, TFA, ácido acético)
    if (d.nn.indexOf(q) === 0) return 2;             // el nombre empieza con lo buscado
    if ((' ' + d.nn.replace(/[^a-z0-9]+/g, ' ')).indexOf(' ' + words[0]) >= 0) return 3; // alguna palabra empieza así
    return 4;
  }

  function ficha(d) {
    var url = CASRE.test(d.cas)
      ? 'https://pubchem.ncbi.nlm.nih.gov/compound/' + encodeURIComponent(d.cas) + '#section=Safety-and-Hazards'
      : 'https://pubchem.ncbi.nlm.nih.gov/#query=' + encodeURIComponent(d.n);
    return '<a class="ficha" href="' + url + '" target="_blank" rel="noopener">Ficha de seguridad ↗</a>';
  }

  function actualizarURL(q, lab, cat) {
    var p = new URLSearchParams();
    if (q) p.set('q', q); if (lab) p.set('lab', lab); if (cat) p.set('cat', cat);
    var s = p.toString();
    try { history.replaceState(null, '', location.pathname + (s ? '?' + s : '')); } catch (e) {}
    document.getElementById('share').hidden = !s;
  }

  function search() {
    var qraw = document.getElementById('q').value.trim();
    var lab = document.getElementById('lab').value, cat = document.getElementById('cat').value;
    var out = document.getElementById('out'), count = document.getElementById('count');
    actualizarURL(qraw, lab, cat);
    if (!LOADED) { count.textContent = ''; out.innerHTML = '<div class="loading">Cargando inventario…</div>'; return; }
    if (!qraw && !lab && !cat) { count.textContent = ''; out.innerHTML = ''; return; }
    var q = norm(qraw), qc = compact(qraw);
    var words = q.split(/\s+/).filter(function (w) { return w && !VACIAS[w]; });
    if (!words.length && q) words = q.split(/\s+/).filter(Boolean);
    // Cada palabra se busca también traducida (español <-> inglés)
    var vars = words.map(function (w) { return [w].concat(PAL2[w] || []); });
    var res = DATA.filter(function (d) {
      if (lab && d.labs.indexOf(lab) < 0) return false;
      if (cat && d.cat !== cat) return false;
      return vars.every(function (vs) { return vs.some(function (w) { var wc = compact(w); return d.t.indexOf(w) >= 0 || (wc && d.c.indexOf(wc) >= 0); }); });
    });
    if (words.length) res.forEach(function (d) { d.s = puntaje(d, q, qc, words); });
    res.sort(function (a, b) { return (words.length ? a.s - b.s : 0) || keyNum(a.k) - keyNum(b.k); });
    count.textContent = res.length + (res.length === 1 ? ' reactivo' : ' reactivos') + (res.length > MAX ? ' (se muestran los primeros ' + MAX + ')' : '');
    if (!res.length) { out.innerHTML = '<div class="empty">Sin resultados. Prueba con menos letras o con el CAS.</div>'; return; }
    var hw = [].concat.apply([], vars);
    var h = '<div class="list">';
    res.slice(0, MAX).forEach(function (d) {
      var varios = d.labs.length > 1;
      h += '<div class="item c' + esc(d.cat.charAt(0)) + '"><div class="top"><span class="k">' + hl(d.k, hw) + '</span><span class="n">' + hl(d.n, hw) + '</span>' +
           '<span class="labs">' + d.labs.map(function (l) { return '<span class="tag">' + esc(l) + '</span>'; }).join('') + '</span></div>' +
           '<div class="meta">' + (d.cas ? '<span>CAS <b>' + hl(d.cas, hw) + '</b></span>' : '') + '<span class="cat">' + esc(d.cat.replace(/^[A-E] · /, '')) + '</span>' + (d.abr.length ? '<span class="abr">' + d.abr.map(function (a) { return hl(a, hw); }).join(' · ') + '</span>' : '') + ficha(d) + '</div>' +
           '<div class="pres">' + d.pres.map(function (p) {
             var txt = [p.q, p.m].filter(Boolean).map(esc).join(' · ');
             if (p.p) txt += ' · ' + esc(p.p) + (/^\d+$/.test(p.p) ? (p.p === '1' ? ' pza' : ' pzas') : '');
             if (varios && p.lab) txt += ' <span class="lab">(' + esc(p.lab) + ')</span>';
             return '<span class="p">' + (txt || '—') + '</span>';
           }).join('') + '</div>' +
           (d.notas.length ? '<div class="note">' + esc(d.notas.join(' · ')) + '</div>' : '') + '</div>';
    });
    out.innerHTML = h + '</div>';
  }

  // Parámetros del enlace (?q=...&lab=...&cat=...)
  var PARAMS = {};
  try { var sp = new URLSearchParams(location.search); PARAMS = { q: sp.get('q') || '', lab: sp.get('lab') || '', cat: sp.get('cat') || '' }; } catch (e) {}
  document.getElementById('q').value = PARAMS.q || '';
  document.getElementById('lab').value = PARAMS.lab || '';

  var timer;
  document.getElementById('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(search, 120); });
  document.getElementById('lab').addEventListener('change', search);
  document.getElementById('cat').addEventListener('change', search);
  document.getElementById('share').addEventListener('click', function () {
    var b = this, url = location.href;
    var ok = function () { b.textContent = '¡Enlace copiado!'; setTimeout(function () { b.textContent = 'Copiar enlace de esta búsqueda'; }, 1800); };
    if (navigator.share && /Mobi|Android|iPhone/i.test(navigator.userAgent)) { navigator.share({ title: 'Inventario Molina Group', url: url }).catch(function () {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(ok, function () { prompt('Copia este enlace:', url); });
    else prompt('Copia este enlace:', url);
  });

  var API = 'https://script.google.com/macros/s/AKfycbzd0u9hGwlOWxvFpax4MNk5qxwiMw7r8cyLlFrZT0tt7KkL9A9VMW5uak-oVY8EWOZM/exec?formato=json';

  // 1) muestra al instante la última copia guardada en este dispositivo
  var KEY = 'inventarioMolinaGroup';
  try { var c = localStorage.getItem(KEY); if (c) load(JSON.parse(c), true); } catch (e) {}

  // 2) copia rápida directa de la hoja (≈1 s). Puede omitir algunas "Piezas" escritas como texto;
  //    la versión completa del paso 3 la reemplaza en cuanto llega.
  var SHEET = 'https://docs.google.com/spreadsheets/d/1HjVBMK1kjFE-HdpbIdulIALYRczW6ZWsjiSCKN6d41I/gviz/tq?tqx=out:csv&headers=0&sheet=';
  var CAT = { 'Organic Solids': 'A · Sólidos orgánicos', 'Inorganic Solids': 'B · Sólidos inorgánicos',
              'Organic Liquids': 'C · Líquidos orgánicos', 'Solvents': 'D · Disolventes', 'Refrigerator': 'E · Refrigerador' };
  function csv(t) {
    var out = [], row = [], f = '', q = false;
    for (var i = 0; i < t.length; i++) {
      var ch = t[i];
      if (q) { if (ch === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { row.push(f); f = ''; }
      else if (ch === '\n') { row.push(f); out.push(row); row = []; f = ''; }
      else if (ch !== '\r') f += ch;
    }
    if (f || row.length) { row.push(f); out.push(row); }
    return out;
  }
  function bloques(hoja, v) {
    var rows = [];
    for (var r = 0; r < v.length; r++) for (var c = 1; c < v[r].length; c++) {
      if (String(v[r][c]).trim().toLowerCase() !== 'key') continue;
      var et = r > 0 ? String(v[r - 1][c - 1] || '') : '';
      var lab = /1-6/.test(et) ? '1-6' : (/2-1/.test(et) ? '2-1' : '');
      for (var i = r + 1; i < v.length; i++) {
        var f = v[i], g = function (k) { return k < f.length ? String(f[k] || '').trim() : ''; };
        var n = g(c - 1), k = g(c);
        if (!n || !k) continue;
        rows.push([k, n, g(c + 4), g(c + 1), g(c + 2), g(c + 3), lab, CAT[hoja], g(c + 5)]);
      }
    }
    return rows;
  }
  Promise.all(Object.keys(CAT).map(function (h) {
    return fetch(SHEET + encodeURIComponent(h), { credentials: 'omit', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (t) { return bloques(h, csv(t)); });
  })).then(function (partes) {
    if (FULL) return;
    var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    load({ rows: [].concat.apply([], partes),
           actualizado: p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) }, true);
  }).catch(function () {});

  // 3) versión completa (Apps Script); reemplaza a las anteriores y se guarda en el dispositivo
  fetch(API, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (res) {
      FULL = true;
      load(res, false);
      try { localStorage.setItem(KEY, JSON.stringify(res)); } catch (e) {}
    })
    .catch(function (e) {
      var sub = document.getElementById('sub');
      if (LOADED) { sub.textContent = sub.textContent.replace(' · actualizando…', ''); return; }
      sub.textContent = '';
      document.getElementById('out').innerHTML = '<div class="empty">No se pudo leer el inventario (' + esc(e.message || e) + '). Recarga la página en un momento.</div>';
    });
</script>
